version: 2
# Python and frontend dependencies get security updates only: `open-pull-requests-limit: 0` turns
# off routine version-bump PRs for an ecosystem, but Dependabot still opens a PR when an alert has a
# fix (Settings > Code security > Dependabot security updates must stay enabled). The pinned tools,
# actions and base images below keep monthly version updates so the #956 pins don't go stale.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      # typescript-eslint@8.70.1 (latest) still peers on "typescript >=4.8.4 <6.1.0";
      # remove once a typescript-eslint release supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The exact splat-transform pin the backend runs (#956); bumps update package.json and the lock.
  - package-ecosystem: "npm"
    directory: "/tools/splat-transform"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images are digest-pinned (#956); this refreshes the digests. Node and Python
  # stay on the major/minor lines CI and the docs target, so only digest and patch bumps are opened.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
