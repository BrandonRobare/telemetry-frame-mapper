version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      # typescript-eslint@8.70.1 (latest) still peers on "typescript >=4.8.4 <6.1.0";
      # remove once a typescript-eslint release supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The exact splat-transform pin the backend runs (#956); bumps update package.json and the lock.
  - package-ecosystem: "npm"
    directory: "/tools/splat-transform"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images are digest-pinned (#956); this refreshes the digests. Node and Python
  # stay on the major/minor lines CI and the docs target, so only digest and patch bumps are opened.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
