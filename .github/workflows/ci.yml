name: CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_metal_preset_benchmark:
        description: Run the pinned Aukerman survey benchmark on Apple Silicon
        required: false
        type: boolean
        default: false
      heldout_parity_target:
        description: Run the #784 held-out bundle on target hardware
        required: false
        type: choice
        options: [none, metal, cuda]
        default: none
      heldout_parity_approved_sha:
        description: Exact reviewed commit for a #784 hardware run
        required: false
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate locked Python supply chain configuration
        run: python tests/test_supply_chain_configuration.py

      - name: Check Python lock metadata
        run: uv lock --check

      - name: Install locked test environment
        run: uv sync --frozen --group backend --group reconstruction --group dev --group audit

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --group backend --group reconstruction --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uv run --frozen --no-sync pip-audit -r /tmp/runtime-requirements.txt

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Test
        run: uv run --frozen --no-sync pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build single-container image
        run: docker build -t telemetry-frame-mapper:ci .

      - name: Reject the default unauthenticated LAN bind
        run: |
          set -euo pipefail
          if docker run --name telemetry-frame-mapper-default telemetry-frame-mapper:ci; then
            echo "Expected the default unauthenticated non-loopback bind to be rejected"
            exit 1
          fi
          docker logs telemetry-frame-mapper-default 2>&1 | grep --fixed-strings "not loopback but no authentication"
          docker rm telemetry-frame-mapper-default

      - name: Smoke container health
        run: |
          set -euo pipefail
          printf 'deployment:\n  allow_unauthenticated_lan: true\n' > "$RUNNER_TEMP/telemetry-frame-mapper-ci.yaml"
          docker run --detach \
            --publish 127.0.0.1:8000:8000 \
            --volume "$RUNNER_TEMP/telemetry-frame-mapper-ci.yaml:/app/config.yaml:ro" \
            --name telemetry-frame-mapper-ci \
            telemetry-frame-mapper:ci
          trap 'docker rm --force telemetry-frame-mapper-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs telemetry-frame-mapper-ci
          exit 1

  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build

      - name: Install and smoke wheel CLIs in a clean environment
        run: |
          set -euo pipefail
          uv venv --clear "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/drone-video-geotagger" --help
          "$RUNNER_TEMP/wheel-venv/bin/dvg-pipeline" --help

  windows-package:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked packaging and test environment
        run: uv sync --frozen --group backend --group desktop-package --group dev

      # The Windows job intentionally runs the CLI suite plus settings atomic-write tests:
      # they exercise path, subprocess, and redirected-stream behavior where Windows differs.
      # The full suite remains on the Linux matrix to keep the Windows packaging job bounded.
      - name: Test Windows-sensitive Python suites
        run: >-
          uv run --frozen --no-sync pytest
          tests/cli
          tests/backend/test_settings_router.py
          tests/backend/test_ingest_orchestrator.py::test_run_disambiguates_duplicate_nested_basenames_and_thumbnails

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Windows bundle
        run: uv run --frozen --no-sync powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1

      - name: Smoke Windows startup and migrations
        run: uv run --frozen --no-sync powershell -ExecutionPolicy Bypass -File packaging/windows/smoke.ps1

  macos-package:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install real external tools
        run: brew install ffmpeg exiftool colmap

      - name: Verify real external tools
        run: |
          set -euo pipefail
          for tool in ffmpeg exiftool colmap; do
            path="$(command -v "$tool")"
            printf '%s=%s\n' "$tool" "$path"
          done
          ffmpeg -version
          exiftool -ver
          colmap -h

      - name: Validate locked Python supply chain configuration
        run: python tests/test_supply_chain_configuration.py

      - name: Check Python lock metadata
        run: uv lock --check

      - name: Install locked macOS test and packaging environment
        run: >-
          uv sync --frozen --group backend --group reconstruction
          --group desktop-package --group splat-metal --group dev --group audit

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --group backend --group reconstruction --group splat-metal --format requirements-txt --output-file /tmp/macos-runtime-requirements.txt
          uv run --frozen --no-sync pip-audit -r /tmp/macos-runtime-requirements.txt

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Run full Python suite
        run: uv run --frozen --no-sync pytest

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Probe packaged runtime dependencies
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import json
          from pathlib import Path

          from backend.routers.system import get_resources

          resources = get_resources()
          tools = {tool["key"]: tool for tool in resources["tools"]}
          for key in ("ffmpeg", "exiftool", "colmap"):
              assert tools[key]["available"], tools[key]
              assert tools[key]["path"], tools[key]
          assert resources["colmap_capabilities"]["available"], resources["colmap_capabilities"]
          Path("macos-system-resources.json").write_text(
              json.dumps(resources, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY

      - name: Build macOS bundle
        run: |
          set -o pipefail
          uv run --frozen --no-sync bash packaging/macos/build.sh 2>&1 | tee macos-build.log

      - name: Smoke macOS bundle
        run: |
          set -o pipefail
          uv run --frozen --no-sync bash packaging/macos/smoke.sh 2>&1 | tee macos-smoke.log

      - name: Package macOS evidence
        run: |
          ditto -c -k --keepParent "dist/Telemetry Frame Mapper.app" macos-arm64-bundle.zip
          shasum -a 256 macos-arm64-bundle.zip > macos-arm64-bundle.zip.sha256

      - name: Upload macOS bundle and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-${{ github.sha }}
          path: |
            macos-arm64-bundle.zip
            macos-arm64-bundle.zip.sha256
            macos-build.log
            macos-smoke.log
            macos-system-resources.json

  metal-preset-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_metal_preset_benchmark
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install real COLMAP and locked Metal environment
        run: |
          brew install colmap
          uv sync --frozen --group backend --group reconstruction --group splat-metal --group dev

      - name: Fetch and verify pinned CC0 Aukerman survey
        env:
          FIXTURE_COMMIT: 4e8031630f4193494c79b1c1d3524108826d1ba9
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/aukerman-source"
          git init "$fixture"
          git -C "$fixture" remote add origin https://github.com/OpenDroneMap/odm_data_aukerman.git
          git -C "$fixture" fetch --depth 1 origin "$FIXTURE_COMMIT"
          git -C "$fixture" checkout --detach FETCH_HEAD
          test "$(git -C "$fixture" rev-parse HEAD)" = "$FIXTURE_COMMIT"
          test "$(find "$fixture/images" -type f | wc -l | tr -d ' ')" = "77"
          test "$(shasum -a 256 "$fixture/license.txt" | cut -d ' ' -f 1)" = "36ffd9dc085d529a7e60e1276d73ae5a030b020313e6c5408593a6ae2af39673"
          FIXTURE="$fixture" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["FIXTURE"])
          lines = []
          for path in sorted((root / "images").iterdir()):
              if path.is_file():
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          Path("aukerman-images.sha256").write_text("\n".join(lines) + "\n")
          PY

      - name: Generate fixed COLMAP sparse model
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/aukerman-source"
          workspace="$RUNNER_TEMP/aukerman-colmap"
          mkdir -p "$workspace/sparse"
          ln -s "$fixture/images" "$workspace/images"
          colmap feature_extractor --database_path "$workspace/database.db" --image_path "$workspace/images" --ImageReader.camera_model PINHOLE --ImageReader.single_camera 1 --SiftExtraction.max_num_features 2048 --FeatureExtraction.max_image_size 1200 --FeatureExtraction.num_threads 4 2>&1 | tee colmap-feature.log
          colmap spatial_matcher --database_path "$workspace/database.db" --SpatialMatching.ignore_z 1 --SpatialMatching.max_num_neighbors 8 --SpatialMatching.max_distance 100 2>&1 | tee colmap-matching.log
          colmap mapper --database_path "$workspace/database.db" --image_path "$workspace/images" --output_path "$workspace/sparse" --Mapper.num_threads 4 2>&1 | tee colmap-mapper.log
          best="$(find "$workspace/sparse" -mindepth 1 -maxdepth 1 -type d | sort -n | head -1)"
          test -n "$best"
          colmap model_converter --input_path "$best" --output_path "$best" --output_type TXT
          colmap model_analyzer --path "$best" | tee colmap-model.txt
          BEST="$best" uv run --frozen --no-sync python -c 'import os; from pathlib import Path; from backend.services import colmap_io; model = colmap_io.read_model(Path(os.environ["BEST"])); assert len(model.images) >= 70, f"only {len(model.images)}/77 views registered"'
          tar -czf aukerman-colmap-sparse.tar.gz -C "$workspace" sparse

      - name: Measure Metal quick-preset candidates
        env:
          FIXTURE_COMMIT: 4e8031630f4193494c79b1c1d3524108826d1ba9
        run: |
          set -euo pipefail
          manifest_sha="$(shasum -a 256 aukerman-images.sha256 | cut -d ' ' -f 1)"
          uv pip freeze > metal-preset-environment.txt
          colmap --version >> metal-preset-environment.txt
          uv run --frozen --no-sync python -m scripts.benchmark_metal_presets \
            --colmap-dir "$RUNNER_TEMP/aukerman-colmap" \
            --fixture-commit "$FIXTURE_COMMIT" \
            --image-manifest-sha256 "$manifest_sha" \
            --candidates 1250,1500,2000,2500,3000 \
            --minimum-growth-ratio 1.25 \
            --output metal-preset-benchmark.json

      - name: Upload Metal preset evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metal-preset-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            aukerman-colmap-sparse.tar.gz
            aukerman-images.sha256
            colmap-*.log
            colmap-model.txt
            metal-preset-benchmark.json
            metal-preset-environment.txt

  heldout-parity-metal:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/wave8/784-cuda-metal-parity' &&
      inputs.heldout_parity_approved_sha != '' &&
      inputs.heldout_parity_target == 'metal'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify exact branch checkout
        env:
          APPROVED_SHA: ${{ inputs.heldout_parity_approved_sha }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/wave8/784-cuda-metal-parity"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_SHA}" = "${APPROVED_SHA}"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned Metal environment
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          uv sync --frozen --group backend --group reconstruction --group splat-metal
          uv run --no-sync python -c 'import importlib.metadata, msplat; assert importlib.metadata.version("msplat") == "1.1.4"; msplat.sync()'
      - name: Fetch pinned CC0 source
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/aukerman-source"
          git -C "$RUNNER_TEMP/aukerman-source" remote add origin https://github.com/OpenDroneMap/odm_data_aukerman.git
          git -C "$RUNNER_TEMP/aukerman-source" fetch --depth 1 origin 4e8031630f4193494c79b1c1d3524108826d1ba9
          git -C "$RUNNER_TEMP/aukerman-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/aukerman-source" rev-parse HEAD)" = "4e8031630f4193494c79b1c1d3524108826d1ba9"
      - name: Run Metal held-out bundle
        run: uv run --frozen --no-sync python -m scripts.benchmark_heldout_parity run --kind metal --source "$RUNNER_TEMP/aukerman-source" --output heldout-metal.tar.gz
      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heldout-metal-${{ github.sha }}
          if-no-files-found: warn
          path: heldout-metal.tar.gz
          retention-days: 90

  heldout-parity-cuda:
    # Owner-dispatched only. Public pull requests and pushes cannot queue this trusted runner.
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/wave8/784-cuda-metal-parity' &&
      inputs.heldout_parity_approved_sha != '' &&
      inputs.heldout_parity_target == 'cuda'
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify exact branch checkout
        env:
          APPROVED_SHA: ${{ inputs.heldout_parity_approved_sha }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/wave8/784-cuda-metal-parity"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_SHA}" = "${APPROVED_SHA}"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify CUDA 12.4 runner contract
        run: |
          set -euo pipefail
          nvidia-smi
          nvcc --version
          case "$(nvcc --version)" in *"release 12.4"*) ;; *) exit 1 ;; esac
      - name: Install pinned CUDA harness environment
        run: |
          set -euo pipefail
          uv sync --frozen --group backend --group reconstruction
          uv pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cu124
          uv pip install "ninja==1.13.0"
          uv pip install "gsplat==1.5.3" --no-build-isolation
      - name: Prove real CUDA and compiled gsplat
        run: |
          uv run --no-sync python - <<'PY'
          import gsplat
          import torch
          assert torch.__version__.startswith("2.6.0")
          assert torch.version.cuda == "12.4"
          assert torch.cuda.is_available()
          assert getattr(gsplat, "_C", None) is not None
          print(torch.cuda.get_device_name())
          print(torch.cuda.get_device_capability())
          device = torch.device("cuda")
          kwargs = {
              "means": torch.tensor([[0.0, 0.0, 2.0]], device=device),
              "quats": torch.tensor([[1.0, 0.0, 0.0, 0.0]], device=device),
              "scales": torch.tensor([[0.1, 0.1, 0.1]], device=device),
              "opacities": torch.tensor([0.9], device=device),
              "colors": torch.tensor([[[1.0, 0.0, 0.0]]], device=device),
              "viewmats": torch.eye(4, device=device)[None],
              "Ks": torch.tensor([[[16.0, 0.0, 8.0], [0.0, 16.0, 8.0], [0.0, 0.0, 1.0]]], device=device),
              "width": 16,
              "height": 16,
              "sh_degree": 0,
              "packed": True,
          }
          render, _, _ = gsplat.rasterization(**kwargs)
          torch.cuda.synchronize()
          assert render.is_cuda and torch.isfinite(render).all()
          PY
      - name: Fetch pinned CC0 source
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/aukerman-source"
          git -C "$RUNNER_TEMP/aukerman-source" remote add origin https://github.com/OpenDroneMap/odm_data_aukerman.git
          git -C "$RUNNER_TEMP/aukerman-source" fetch --depth 1 origin 4e8031630f4193494c79b1c1d3524108826d1ba9
          git -C "$RUNNER_TEMP/aukerman-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/aukerman-source" rev-parse HEAD)" = "4e8031630f4193494c79b1c1d3524108826d1ba9"
      - name: Run CUDA held-out bundle
        run: uv run --frozen --no-sync python -m scripts.benchmark_heldout_parity run --kind cuda --source "$RUNNER_TEMP/aukerman-source" --output heldout-cuda.tar.gz
      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heldout-cuda-${{ github.sha }}
          if-no-files-found: warn
          path: heldout-cuda.tar.gz
          retention-days: 90
