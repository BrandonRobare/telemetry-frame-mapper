name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate locked Python supply chain configuration
        run: python tests/test_supply_chain_configuration.py

      - name: Check Python lock metadata
        run: uv lock --check

      - name: Install locked test environment
        run: uv sync --frozen --group backend --group reconstruction --group dev --group audit

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --group backend --group reconstruction --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uv run --frozen --no-sync pip-audit -r /tmp/runtime-requirements.txt

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Test
        run: uv run --frozen --no-sync pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build single-container image
        run: docker build -t telemetry-frame-mapper:ci .

      - name: Reject the default unauthenticated LAN bind
        run: |
          set -euo pipefail
          if docker run --name telemetry-frame-mapper-default telemetry-frame-mapper:ci; then
            echo "Expected the default unauthenticated non-loopback bind to be rejected"
            exit 1
          fi
          docker logs telemetry-frame-mapper-default 2>&1 | grep --fixed-strings "not loopback but no authentication"
          docker rm telemetry-frame-mapper-default

      - name: Smoke container health
        run: |
          set -euo pipefail
          printf 'deployment:\n  allow_unauthenticated_lan: true\n' > "$RUNNER_TEMP/telemetry-frame-mapper-ci.yaml"
          docker run --detach \
            --publish 127.0.0.1:8000:8000 \
            --volume "$RUNNER_TEMP/telemetry-frame-mapper-ci.yaml:/app/config.yaml:ro" \
            --name telemetry-frame-mapper-ci \
            telemetry-frame-mapper:ci
          trap 'docker rm --force telemetry-frame-mapper-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs telemetry-frame-mapper-ci
          exit 1

  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build

      - name: Install and smoke wheel CLIs in a clean environment
        run: |
          set -euo pipefail
          uv venv --clear "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/drone-video-geotagger" --help
          "$RUNNER_TEMP/wheel-venv/bin/dvg-pipeline" --help

  windows-package:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked packaging and test environment
        run: uv sync --frozen --group backend --group desktop-package --group dev

      # The Windows job intentionally runs the CLI suite plus settings atomic-write tests:
      # they exercise path, subprocess, and redirected-stream behavior where Windows differs.
      # The full suite remains on the Linux matrix to keep the Windows packaging job bounded.
      - name: Test Windows-sensitive Python suites
        run: >-
          uv run --frozen --no-sync pytest
          tests/cli
          tests/backend/test_settings_router.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Windows bundle
        run: uv run --frozen --no-sync powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1

      - name: Smoke Windows startup and migrations
        run: uv run --frozen --no-sync powershell -ExecutionPolicy Bypass -File packaging/windows/smoke.ps1

  macos-package:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install real external tools
        run: brew install ffmpeg exiftool colmap

      - name: Verify real external tools
        run: |
          set -euo pipefail
          for tool in ffmpeg exiftool colmap; do
            path="$(command -v "$tool")"
            printf '%s=%s\n' "$tool" "$path"
          done
          ffmpeg -version
          exiftool -ver
          colmap -h

      - name: Validate locked Python supply chain configuration
        run: python tests/test_supply_chain_configuration.py

      - name: Check Python lock metadata
        run: uv lock --check

      - name: Install locked macOS test and packaging environment
        run: >-
          uv sync --frozen --group backend --group reconstruction
          --group desktop-package --group dev --group audit

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --group backend --group reconstruction --format requirements-txt --output-file /tmp/macos-runtime-requirements.txt
          uv run --frozen --no-sync pip-audit -r /tmp/macos-runtime-requirements.txt

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Run full Python suite
        run: uv run --frozen --no-sync pytest

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Probe packaged runtime dependencies
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import json
          from pathlib import Path

          from backend.routers.system import get_resources

          resources = get_resources()
          tools = {tool["key"]: tool for tool in resources["tools"]}
          for key in ("ffmpeg", "exiftool", "colmap"):
              assert tools[key]["available"], tools[key]
              assert tools[key]["path"], tools[key]
          assert resources["colmap_capabilities"]["available"], resources["colmap_capabilities"]
          Path("macos-system-resources.json").write_text(
              json.dumps(resources, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY

      - name: Build macOS bundle
        run: |
          set -o pipefail
          uv run --frozen --no-sync bash packaging/macos/build.sh 2>&1 | tee macos-build.log

      - name: Smoke macOS bundle
        run: |
          set -o pipefail
          uv run --frozen --no-sync bash packaging/macos/smoke.sh 2>&1 | tee macos-smoke.log

      - name: Package macOS evidence
        run: |
          ditto -c -k --keepParent "dist/Telemetry Frame Mapper.app" macos-arm64-bundle.zip
          shasum -a 256 macos-arm64-bundle.zip > macos-arm64-bundle.zip.sha256

      - name: Upload macOS bundle and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-${{ github.sha }}
          path: |
            macos-arm64-bundle.zip
            macos-arm64-bundle.zip.sha256
            macos-build.log
            macos-smoke.log
            macos-system-resources.json
