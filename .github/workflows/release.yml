name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  frontend-dist:
    name: Build and attach frontend/dist
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Zip frontend dist
        run: python3 -m zipfile --create frontend-dist.zip frontend/dist

      - name: Upload release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inputs
          path: |
            frontend-dist.zip
            release-notes/${{ github.ref_name }}.md

  publish-frontend-dist:
    name: Publish frontend/dist
    needs: frontend-dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs

      - name: Upload frontend dist to release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          files: frontend-dist.zip
