name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  frontend-dist:
    name: Build and attach frontend/dist
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Zip frontend dist
        run: python3 -m zipfile --create frontend-dist.zip frontend/dist

      - name: Upload frontend dist to release
        uses: softprops/action-gh-release@v3
        with:
          files: frontend-dist.zip
