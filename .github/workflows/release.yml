name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verification:
    name: Run complete verification
    uses: ./.github/workflows/ci.yml

  frontend-dist:
    name: Build and attach frontend/dist
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Zip frontend dist
        run: python3 -m zipfile --create frontend-dist.zip frontend/dist

      - name: Upload release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs
          path: |
            frontend-dist.zip
            release-notes/${{ github.ref_name }}.md

  publish-frontend-dist:
    name: Publish frontend/dist
    needs: [verification, frontend-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs

      - name: Upload frontend dist to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          files: frontend-dist.zip
