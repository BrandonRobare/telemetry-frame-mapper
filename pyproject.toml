[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-video-geotagger"
version = "2.0.5"
description = "Geotags DJI drone video frames with GPS EXIF metadata for WebODM/OpenDroneMap processing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml==6.0.3"
]
license = "MIT"
authors = [
  { name = "Brandon" }
]
keywords = ["dji", "exif", "geotagging", "webodm", "opendronemap"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: GIS"
]

[dependency-groups]
backend = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "sqlalchemy==2.0.51",
  "alembic==1.19.0",
  "pillow==12.3.0",
  "piexif==1.1.3",
  "opencv-python-headless==5.0.0.93",
  "numpy>=2",
  "shapely==2.1.2",
  "geopandas==1.1.4",
  "pyproj==3.7.2",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "aiofiles==25.1.0",
  "lxml==6.1.1",
  "gpxpy==1.6.2",
  "simplekml==1.3.6",
  "psutil>=5.9",
  "pydjirecord>=1.3.0"
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio==1.4.0",
  "ruff>=0.4"
]
audit = [
  "pip-audit==2.10.1",
]
# torch and gsplat are intentionally NOT listed here: CUDA-enabled torch is not on the
# default PyPI index, and gsplat's sdist requires torch at build time, so the dependency group could
# never resolve as advertised. GPU training install is a manual two-step — see docs/SETUP.md.
reconstruction = [
  "laspy[lazrs]>=2.5",
  "rasterio>=1.4",
  # Live GPU utilisation / VRAM for the Jobs tab resource bar. Optional at runtime
  # (the readout degrades to blank), but it was previously undeclared, so that
  # display never worked on any install. nvidia-ml-py is the maintained
  # distribution providing the `pynvml` module; the `pynvml` distribution itself
  # is deprecated and warns on import.
  "nvidia-ml-py>=12"
]
semantic = [
  "transformers>=4.48",
  "safetensors",
]
desktop-package = [
  "pyinstaller>=6.22.0",
]

[project.scripts]
drone-video-geotagger = "drone_video_geotagger.cli:main"
dvg-pipeline = "drone_video_geotagger.pipeline_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_video_geotagger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/services/survey_report.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
pythonpath = [".", "src"]
