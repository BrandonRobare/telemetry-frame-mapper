[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-video-geotagger"
version = "1.0.0"
description = "Geotags DJI drone video frames with GPS EXIF metadata for WebODM/OpenDroneMap processing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Brandon" }
]
keywords = ["dji", "exif", "geotagging", "webodm", "opendronemap"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: GIS"
]

[project.optional-dependencies]
backend = [
  "fastapi==0.138.2",
  "uvicorn[standard]==0.51.0",
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "pyyaml==6.0.3",
  "pillow==12.2.0",
  "piexif==1.1.3",
  "opencv-python-headless==4.13.0.92",
  "numpy>=2",
  "shapely==2.1.2",
  "geopandas==1.1.4",
  "pyproj==3.7.1",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "aiofiles==25.1.0",
  "lxml==6.1.1",
  "gpxpy==1.6.2",
  "simplekml==1.3.6",
  "psutil>=5.9",
  "pydjirecord>=1.3.0"
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio==1.4.0",
  "ruff>=0.4"
]
# torch and gsplat are intentionally NOT listed here: CUDA-enabled torch is not on the
# default PyPI index, and gsplat's sdist requires torch at build time, so the extra could
# never resolve as advertised. GPU training install is a manual two-step — see docs/SETUP.md.
reconstruction = [
  "laspy[lazrs]>=2.5",
  "rasterio>=1.4"
]
semantic = [
  "transformers>=4.48",
  "safetensors",
]

[project.scripts]
drone-video-geotagger = "drone_video_geotagger.cli:main"
dvg-pipeline = "drone_video_geotagger.pipeline_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_video_geotagger"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/services/survey_report.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
pythonpath = [".", "src"]
