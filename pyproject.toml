[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-video-geotagger"
version = "3.0.0"
description = "Geotags DJI drone video frames with GPS EXIF metadata for WebODM/OpenDroneMap processing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml==6.0.3"
]
license = "MIT"
authors = [
  { name = "Brandon" }
]
keywords = ["dji", "exif", "geotagging", "webodm", "opendronemap"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: GIS"
]

[dependency-groups]
backend = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "pillow==12.3.0",
  "piexif==1.1.3",
  "opencv-python-headless==5.0.0.93",
  "numpy>=2",
  "shapely==2.1.2",
  "geopandas==1.1.4",
  "pyproj==3.7.2",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "aiofiles==25.1.0",
  "lxml==6.1.3",
  "gpxpy==1.6.2",
  "simplekml==1.3.6",
  "psutil>=5.9",
  "pydjirecord>=1.3.0"
]
dev = [
  "pytest>=8.0",
  "pytest-timeout==2.4.0",
  "pytest-asyncio==1.4.0",
  "ruff>=0.4"
]
audit = [
  "pip-audit==2.10.1",
]
# torch and gsplat are intentionally NOT listed here: CUDA-enabled torch is not on the
# default PyPI index, and gsplat's sdist requires torch at build time, so the dependency group could
# never resolve as advertised. GPU training install is a manual two-step — see docs/SETUP.md.
reconstruction = [
  "laspy[lazrs]>=2.5",
  "rasterio>=1.4",
  # Live GPU utilisation / VRAM for the Jobs tab resource bar. Optional at runtime
  # (the readout degrades to blank), but it was previously undeclared, so that
  # display never worked on any install. nvidia-ml-py is the maintained
  # distribution providing the `pynvml` module; the `pynvml` distribution itself
  # is deprecated and warns on import.
  "nvidia-ml-py>=12"
]
semantic = [
  "transformers>=4.48",
  "safetensors",
]
desktop-package = [
  "pyinstaller>=6.22.0",
]
splat-metal = [
  "msplat==1.1.4; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.12' and python_version < '3.14'",
]

[project.scripts]
drone-video-geotagger = "drone_video_geotagger.cli:main"
dvg-pipeline = "drone_video_geotagger.pipeline_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_video_geotagger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/services/survey_report.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "--strict-markers -ra"
timeout = 60
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "unit: isolated; no DB, network or subprocess",
  "integration: API, database, filesystem or subprocess integration",
  "contract: cross-boundary API, schema and packaging agreements",
  "e2e: complete operator journeys",
  "perf: scaling and timing budgets",
  "hardware: requires a real accelerator",
  "area_geotag_cli: geotag-cli",
  "area_ingest_import: ingest-import",
  "area_flight_log_gps: flight-log-gps",
  "area_coverage_planning: coverage-planning",
  "area_reconstruction_splat: reconstruction-splat",
  "area_export_share: export-share",
  "area_platform_ops: platform-ops",
  "area_db_migrations: db-migrations",
  "area_frontend_shared: frontend-shared",
  "area_packaging_release: packaging-release",
]
