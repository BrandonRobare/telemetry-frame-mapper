altitude_ft: 200
fov_horizontal_deg: 83
fov_vertical_deg: 53
image_width_px: 4000
image_height_px: 3000
desired_side_overlap: 0.70
desired_forward_overlap: 0.80
lane_spacing_ft: 105
default_video_fps: 2.0
target_crs: "EPSG:32617"
default_basemap: "esri_satellite"
flight_log_match_tolerance_sec: 2.0
battery_range_m: 3000
mission_buffer_pct: 0.10
rth_altitude_ft: 100
thumbnail_size_px: 200
imports_dir: "./imports"
processed_dir: "./processed"
exports_dir: "./exports"
data_dir: "./data"

reconstruction:
  default_preset: quick
  colmap_threads: 8
  sift_max_features: 8192
  matcher: exhaustive
  camera_model: PINHOLE
  camera_profiles:
    - name: "DJI Mini 3/4 Pro wide camera"
      make: "DJI"
      model: "FC3582"
      lens_model: "24mm F1.7"
      sensor_width_mm: 6.4
      sensor_height_mm: 4.8
      focal_length_mm: 6.72
      fov_horizontal_deg: 73.4
      fov_vertical_deg: 52.2
      colmap_camera_model: PINHOLE
    - name: "DJI Air 2S wide camera"
      make: "DJI"
      model: "FC3411"
      sensor_width_mm: 13.2
      sensor_height_mm: 8.8
      focal_length_mm: 8.4
      fov_horizontal_deg: 76.5
      fov_vertical_deg: 55.3
      colmap_camera_model: PINHOLE
    - name: "DJI Mavic 3 wide camera"
      make: "DJI"
      model: "L2D-20c"
      sensor_width_mm: 17.3
      sensor_height_mm: 13.0
      focal_length_mm: 12.29
      fov_horizontal_deg: 70.3
      fov_vertical_deg: 55.8
      colmap_camera_model: PINHOLE
  presets:
    quick:
      iterations: 1000
      max_frames: 500
      exhaustive_matching: false
      max_gaussians: 350000
      sh_degree: 1
      downscale_factor: 4
    full:
      iterations: 30000
      max_frames: null
      exhaustive_matching: true
      max_gaussians: 1000000
      sh_degree: 2
      downscale_factor: 2

ingest:
  thumbnail_size_px: 200
  thumbnail_jpeg_quality: 75
  accepted_extensions:
    - .jpg
    - .jpeg
  blur_threshold: 100.0
  dark_threshold: 50.0
  bright_threshold: 210.0
  filter_zero_gps: true

render:
  flythrough_fps: 30
  flythrough_width: 1920
  flythrough_height: 1080
  thumbnail_size_px: 512
  thumbnail_quality: 85
  lod_preview_ratio: 0.10
  lod_medium_ratio: 0.50

upload_limits:
  flight_log_max_bytes: 10485760
  srt_max_bytes: 10485760
