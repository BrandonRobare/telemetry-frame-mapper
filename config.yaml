altitude_ft: 200
fov_horizontal_deg: 83
fov_vertical_deg: 53
image_width_px: 4000
image_height_px: 3000
desired_side_overlap: 0.70
desired_forward_overlap: 0.80
lane_spacing_ft: 105
default_video_fps: 2.0
target_crs: "EPSG:32617"
default_basemap: "esri_satellite"
flight_log_match_tolerance_sec: 2.0
battery_range_m: 3000
mission_buffer_pct: 0.10
rth_altitude_ft: 100
thumbnail_size_px: 200
imports_dir: "./imports"
processed_dir: "./processed"
exports_dir: "./exports"
data_dir: "./data"

# `python -m backend` uses this profile. Keep concrete origins only; a LAN bind
# does not grant browser access to arbitrary websites.
deployment:
  host: "127.0.0.1"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"

# Optional single-user local lock. Store only the scrypt hash in the named
# environment variable; restart the backend after enabling it.
pin_lock:
  enabled: false
  pin_hash_env: "DRONE_MAPPING_PIN_HASH"
  session_ttl: 28800

# Local JSONL application log. Rotation retains up to five 10 MiB backups.
logging:
  enabled: true
  level: INFO
  directory: "./logs"
  filename: "backend.jsonl"
  max_bytes: 10485760
  backup_count: 5

reconstruction:
  default_preset: quick
  colmap_threads: 8
  sift_max_features: 8192
  matcher: exhaustive
  camera_model: PINHOLE
  # An explicit dense rerun uses these deterministic post-COLMAP thresholds.
  # It never starts by itself; request the reconstruction's dense-rerun endpoint.
  dense_rerun:
    min_weak_run_frames: 2
    high_reprojection_error_px: 2.0
    context_frames: 1
  camera_profiles:
    - name: "DJI Mini 3/4 Pro wide camera"
      make: "DJI"
      model: "FC3582"
      lens_model: "24mm F1.7"
      sensor_width_mm: 6.4
      sensor_height_mm: 4.8
      focal_length_mm: 6.72
      fov_horizontal_deg: 73.4
      fov_vertical_deg: 52.2
      colmap_camera_model: PINHOLE
    - name: "DJI Air 2S wide camera"
      make: "DJI"
      model: "FC3411"
      sensor_width_mm: 13.2
      sensor_height_mm: 8.8
      focal_length_mm: 8.4
      fov_horizontal_deg: 76.5
      fov_vertical_deg: 55.3
      colmap_camera_model: PINHOLE
    - name: "DJI Mavic 3 wide camera"
      make: "DJI"
      model: "L2D-20c"
      sensor_width_mm: 17.3
      sensor_height_mm: 13.0
      focal_length_mm: 12.29
      fov_horizontal_deg: 70.3
      fov_vertical_deg: 55.8
      colmap_camera_model: PINHOLE
  presets:
    quick:
      iterations: 1000
      max_frames: 500
      exhaustive_matching: false
      max_gaussians: 350000
      sh_degree: 1
      downscale_factor: 4
    full:
      iterations: 30000
      max_frames: null
      exhaustive_matching: true
      max_gaussians: 1000000
      sh_degree: 2
      downscale_factor: 2

# Optional network worker. Keep disabled unless the worker and this API share
# the configured storage paths. Put the bearer token only in the named env var.
remote_worker:
  enabled: false
  url: ""
  auth_token_env: "REMOTE_WORKER_TOKEN"
  timeout_seconds: 10
  poll_interval_seconds: 2
  allow_insecure_http: false

# Optional WebODM API integration. Keep disabled by default and put the JWT
# only in the named environment variable, never in this file.
webodm:
  enabled: false
  url: ""
  jwt_env: "WEBODM_JWT"
  timeout_seconds: 30
  allow_insecure_http: false

ingest:
  thumbnail_size_px: 200
  thumbnail_jpeg_quality: 75
  accepted_extensions:
    - .jpg
    - .jpeg
  blur_threshold: 100.0
  dark_threshold: 50.0
  bright_threshold: 210.0
  filter_zero_gps: true

render:
  flythrough_fps: 30
  flythrough_width: 1920
  flythrough_height: 1080
  thumbnail_size_px: 512
  thumbnail_quality: 85
  lod_preview_ratio: 0.10
  lod_medium_ratio: 0.50

upload_limits:
  flight_log_max_bytes: 10485760
  srt_max_bytes: 10485760

# Opt-in: only these folders are watched. Restart the backend after changing this.
auto_import:
  enabled: false
  roots: []
  poll_interval_seconds: 10
  stable_seconds: 30

# Backup destinations are an allowlist. Keep rclone credentials in rclone's own config.
backup:
  local_destinations: []
  rclone_remote: ""
  # A named target keeps the scheduler from accepting arbitrary destinations.
  targets: {}
  schedule:
    enabled: false
    target: ""
    daily_at: "02:00"  # server-local time, HH:MM
